# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# -------------------------
# Prompt Layout
# -------------------------
format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$c\
$rust\
$golang\
$docker_context\
$jobs\
$cmd_duration
$character"""

# -------------------------
# Modules
# -------------------------

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"
read_only = " 󰌾"

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = "([\\[$all_status$ahead_behind\\]]($style) )"
style = "bold red"

[python]
symbol = " "
format = "via [${symbol}${version}( \\(${virtualenv}\\))]($style) "
style = "bold yellow"

[nodejs]
symbol = " "
format = "via [$symbol]($style) "
style = "bold green"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[cmd_duration]
min_time = 2_000
format = "took [󱎫 $duration]($style) "
style = "yellow"

[jobs]
symbol = "󰜎 "
format = "[$symbol$number]($style) "
style = "bold blue"

[docker_context]
symbol = " "
format = "on [$symbol$context]($style) "
style = "bold blue"

[rust]
symbol = " "
format = "via [$symbol$version]($style) "

[golang]
symbol = " "
format = "via [$symbol$version]($style) "
